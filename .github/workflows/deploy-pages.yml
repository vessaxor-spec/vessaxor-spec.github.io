name: Deploy VESSAXOR portfolio

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Refresh public portfolio data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_site_data.py

      - name: Sync approved portfolio visuals
        run: python3 scripts/sync_site_visuals.py

      - name: Generate responsive portfolio media
        run: node scripts/build_site_media.mjs

      - name: Validate static portfolio
        run: |
          python3 scripts/validate_site.py
          node --check app.js
          node --check scripts/build_site_media.mjs
          node --check scripts/capture_site_render.mjs

      - name: Capture full-page desktop and mobile render review
        run: |
          python3 -m http.server 8000 >/tmp/vessaxor-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 0.2
          done
          node scripts/capture_site_render.mjs http://127.0.0.1:8000/

      - name: Measure live production with Lighthouse 13.4.1
        if: github.event_name == 'pull_request'
        run: |
          npx --yes lighthouse@13.4.1 https://vessaxor-spec.github.io/ \
            --quiet \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=lighthouse-mobile.json
          npx --yes lighthouse@13.4.1 https://vessaxor-spec.github.io/ \
            --quiet \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices,seo \
            --preset=desktop \
            --output=json \
            --output-path=lighthouse-desktop.json
          python3 scripts/summarize_lighthouse.py

      - name: Upload render and performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-review-${{ github.sha }}
          path: |
            render-desktop.png
            render-mobile.png
            lighthouse-mobile.json
            lighthouse-desktop.json
            lighthouse-summary.json
          if-no-files-found: error
          retention-days: 14

  build-pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Refresh public portfolio data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_site_data.py

      - name: Sync approved portfolio visuals
        run: python3 scripts/sync_site_visuals.py

      - name: Generate responsive portfolio media
        run: node scripts/build_site_media.mjs

      - name: Validate static portfolio
        run: |
          python3 scripts/validate_site.py
          node --check app.js
          node --check scripts/build_site_media.mjs

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [validate, build-pages]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
