name: Deploy VESSAXOR portfolio

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Refresh public portfolio data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_site_data.py

      - name: Sync approved portfolio visuals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_site_visuals.py

      - name: Generate responsive portfolio media
        run: node scripts/build_site_media.mjs

      - name: Validate static portfolio
        run: |
          python3 scripts/validate_site.py
          python3 scripts/validate_discovery_notes.py
          python3 -m py_compile scripts/verify_firefox_hero.py
          node --check app.js
          node --check scripts/build_site_media.mjs
          node --check scripts/capture_site_render.mjs

      - name: Capture full-page render and reliability review
        run: |
          python3 -m http.server 8000 >/tmp/vessaxor-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 0.2
          done
          node scripts/capture_site_render.mjs http://127.0.0.1:8000/

      - name: Exercise hero cold loads in Firefox
        run: |
          python3 -m http.server 8000 >/tmp/vessaxor-firefox-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 0.2
          done
          firefox --version
          geckodriver --version
          python3 scripts/verify_firefox_hero.py --base-url http://127.0.0.1:8000/ --iterations 8

      - name: Upload render review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-review-${{ github.sha }}
          path: |
            render-desktop.png
            render-mobile.png
          if-no-files-found: error
          retention-days: 14

  build-pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Refresh public portfolio data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_site_data.py

      - name: Sync approved portfolio visuals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_site_visuals.py

      - name: Generate responsive portfolio media
        run: node scripts/build_site_media.mjs

      - name: Validate static portfolio
        run: |
          python3 scripts/validate_site.py
          python3 scripts/validate_discovery_notes.py
          python3 -m py_compile scripts/verify_firefox_hero.py
          node --check app.js
          node --check scripts/build_site_media.mjs

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [validate, build-pages]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-production:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [deploy]
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify deployed pages and critical media
        run: python3 scripts/verify_production_site.py --base-url https://vessaxor-spec.github.io/

      - name: Exercise deployed hero cold loads in Firefox
        run: |
          firefox --version
          geckodriver --version
          python3 scripts/verify_firefox_hero.py --base-url https://vessaxor-spec.github.io/ --iterations 4

      - name: Publish production verification status
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          passed = os.environ["JOB_STATUS"] == "success"
          payload = {
              "state": "success" if passed else "failure",
              "target_url": os.environ["RUN_URL"],
              "description": (
                  "Live Pages and deployed Firefox verification passed"
                  if passed
                  else "Production verification failed"
              ),
              "context": "vessaxor/pages-production",
          }
          url = (
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
              f"/statuses/{os.environ['COMMIT_SHA']}"
          )
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "vessaxor-production-status/1.0",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status >= 300:
                  raise RuntimeError(f"status publication failed: HTTP {response.status}")
          print(f"published vessaxor/pages-production={payload['state']} for {os.environ['COMMIT_SHA']}")
          PY
